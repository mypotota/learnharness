apply plugin: 'com.android.application'

android {
    namespace "ai.learnharness.mobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.learnharness.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // arm64 only: prepare-mobile-runtime.mjs produces exactly one
            // liblh-node.so (Termux aarch64 node); an x86_64 APK would build
            // but crash at startup with no executable.
            abiFilters "arm64-v8a"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        lhShared {
            storeFile file("../keystore/lh-shared.jks")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.lhShared
        }
        debug {
            // The SHARED dev key, committed at mobile/android/keystore/.
            // Android's default debug key is generated per machine
            // (~/.android/debug.keystore), so a build from another PC had a
            // different signature: `adb install -r` refused and the app had
            // to be uninstalled first — wiping the learner's data. One key
            // for every machine keeps updates in place.
            signingConfig signingConfigs.lhShared
        }
    }
    sourceSets {
        main {
            // Generated by scripts/prepare-mobile-runtime.mjs (see the
            // prepareMobileRuntime task below): the zipped standalone server
            // tree and the node executable as a jniLib.
            assets.srcDirs += ["$buildDir/generated/lh-assets"]
            jniLibs.srcDirs += ["$buildDir/generated/lh-jniLibs"]
        }
    }
    // Android 10+ refuses to exec() binaries from the writable app data dir,
    // so liblh-node.so must be extracted to the read-only nativeLibraryDir
    // (the AGP-8 form of the manifest's android:extractNativeLibs="true").
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    // lh-server.zip is already deflate-9'd by prepare-mobile-runtime.mjs;
    // store it uncompressed so aapt never treats it as a compressed asset
    // (large compressed assets are restricted at read time) and extraction
    // skips a pointless recompress.
    androidResources {
        noCompress 'zip'
    }
}

// The server payload (.next/standalone curated + Termux node + its shared
// libraries) is assembled outside Gradle by the repo's build chain:
//   npm run build → scripts/build-server.mjs → this task's script.
// The script fails loudly when .next/standalone/server.js is missing, so a
// bare `gradle assembleDebug` without the desktop build stops here. Inputs/
// outputs let Gradle skip the ~62 MB re-zip when nothing changed.
tasks.register("prepareMobileRuntime", Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine "node", "scripts/prepare-mobile-runtime.mjs"
    inputs.dir rootProject.file("../../.next/standalone")
    inputs.file file("../../scripts/prepare-mobile-runtime.mjs")
    inputs.dir file("../../.cache/runtime")
    outputs.file new File(buildDir, "generated/lh-assets/lh-server.zip")
    outputs.file new File(buildDir, "generated/lh-jniLibs/arm64-v8a/liblh-node.so")
}
preBuild.dependsOn(tasks.named("prepareMobileRuntime"))

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
